name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Erlang/OTP and Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29.0.3'
      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
        env:
          MIX_ENV: test
      - name: Compile
        run: mix compile
        env:
          MIX_ENV: test
      - name: Check formatting
        run: mix format --check-formatted
      - name: Create database
        run: mix ecto.create
        env:
          MIX_ENV: test
          MMGO_DB_HOST: postgres
          MMGO_DB_USER: postgres
          MMGO_DB_PASSWORD: postgres
      - name: Run migrations
        run: mix ecto.migrate
        env:
          MIX_ENV: test
          MMGO_DB_HOST: postgres
          MMGO_DB_USER: postgres
          MMGO_DB_PASSWORD: postgres
      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test
          MMGO_DB_HOST: postgres
          MMGO_DB_USER: postgres
          MMGO_DB_PASSWORD: postgres

  release:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install Erlang/OTP and Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29.0.3'
      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-prod-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-prod-mix-
      - name: Install production dependencies
        run: mix deps.get --only prod
      - name: Install asset tools
        run: mix assets.setup
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Build assets
        run: mix assets.deploy
      - name: Build OTP release
        run: mix release --overwrite
